runtime:
  work_dir: $INFRA_AGENT_WORKDIR
  log_file: log/infrastructure_agent.log
  dashboard:
    host: 0.0.0.0
    port: 8020

inventory:
  collectors:
    - type: environment
      include:
        - PATH
        - HOME
        - SHELL
        - USER
    - type: host

vault:
  enabled: true
  file: vault.json
  key_env: INFRA_AGENT_VAULT_KEY
  encoding: base64

backups:
  targets:
    - type: local
      name: infrastructure-state
      source:
        - inventory
        - vault.json
      destination: backups
      archive: true
      retention:
        max_files: 5

version_control:
  enabled: true
  repository: .
  branch: main
  auto_init: true
  tracked_paths:
    - .
  user:
    name: Infrastructure Agent
    email: agent@example.com
  message: Infrastructure snapshot captured at {timestamp}
